name: Scheduled jobs

# Nightly jobs. The 15-minute jobs (email outbox, later decision release) run as Netlify
# Scheduled Functions in netlify/functions/, because free GitHub Actions minutes can not
# cover a 15-minute schedule (docs/go-live-checklist.md). The nightly outbox run here is
# a backstop in case the Netlify schedule is ever off.
on:
  schedule:
    - cron: "15 8 * * *" # 03:15 Winnipeg time in summer (08:15 UTC); 02:15 in winter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pco-verify:
    name: Planning Center Group Leader check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$JOBS_SECRET" ]; then
            echo "APP_URL or JOBS_SECRET is not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $JOBS_SECRET" \
            "$APP_URL/api/jobs/pco-verify"

  send-outbox:
    name: Email outbox backstop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$JOBS_SECRET" ]; then
            echo "APP_URL or JOBS_SECRET is not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $JOBS_SECRET" \
            "$APP_URL/api/jobs/send-outbox"

  reminders:
    name: Deadline reminders and failed-email digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$JOBS_SECRET" ]; then
            echo "APP_URL or JOBS_SECRET is not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $JOBS_SECRET" \
            "$APP_URL/api/jobs/reminders"
